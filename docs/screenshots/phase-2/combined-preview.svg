<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc">
  <title id="title">Workout Conductor Phase 2 combined preview</title>
  <desc id="desc">Three real Android screenshots showing the structured catalog, ranked safe swap, and original exercise media metadata.</desc>
  <rect width="1240" height="930" fill="#090b0c"/>
  <text x="40" y="44" fill="#b8ff31" font-family="system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="2">WORKOUT CONDUCTOR · PHASE 2 · WC-P2-0810</text>
  <text x="40" y="83" fill="#f5f7f5" font-family="system-ui,sans-serif" font-size="30" font-weight="800">Exercise intelligence foundation</text>
  <text x="40" y="108" fill="#818a83" font-family="system-ui,sans-serif" font-size="13">Real Android evidence · catalog, conflict-filtered alternatives, and original development media</text>
  <g transform="translate(40 140)">
    <rect width="360" height="800" rx="24" fill="#151918" stroke="#2b332d"/>
    <clipPath id="catalogClip"><rect x="8" y="8" width="344" height="764" rx="17"/></clipPath>
    <image href="catalog-412x915.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#catalogClip)"/>
    <text x="16" y="791" fill="#e1e6e2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Catalog foundation</text>
    <text x="344" y="791" fill="#727a74" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">412 × 915</text>
  </g>
  <g transform="translate(440 140)">
    <rect width="360" height="800" rx="24" fill="#151918" stroke="#2b332d"/>
    <clipPath id="alternativesClip"><rect x="8" y="8" width="344" height="764" rx="17"/></clipPath>
    <image href="alternatives-412x915.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#alternativesClip)"/>
    <text x="16" y="791" fill="#e1e6e2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Ranked safe swap</text>
    <text x="344" y="791" fill="#727a74" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">412 × 915</text>
  </g>
  <g transform="translate(840 140)">
    <rect width="360" height="800" rx="24" fill="#151918" stroke="#2b332d"/>
    <clipPath id="detailClip"><rect x="8" y="8" width="344" height="764" rx="17"/></clipPath>
    <image href="exercise-detail-412x915.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#detailClip)"/>
    <text x="16" y="791" fill="#e1e6e2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Media + metadata</text>
    <text x="344" y="791" fill="#727a74" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">412 × 915</text>
  </g>
