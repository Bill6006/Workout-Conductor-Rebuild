<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc">
  <title id="title">Workout Conductor Phase 3 combined preview</title>
  <desc id="desc">Three real mobile screenshots showing local workout generation, one canonical row per workout block, and 15-minute duration intelligence.</desc>
  <rect width="1240" height="930" fill="#090b0c"/>
  <text x="40" y="44" fill="#b8ff31" font-family="system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="2">WORKOUT CONDUCTOR · PHASE 3 · WC-P3-0810</text>
  <text x="40" y="83" fill="#f5f7f5" font-family="system-ui,sans-serif" font-size="30" font-weight="800">Deterministic workout generation</text>
  <text x="40" y="108" fill="#818a83" font-family="system-ui,sans-serif" font-size="13">Real mobile evidence · local plan, typed block rows, and duration-aware compression</text>
  <g transform="translate(40 140)">
    <rect width="360" height="800" rx="24" fill="#151918" stroke="#2b332d"/>
    <clipPath id="generatorClip"><rect x="8" y="8" width="344" height="764" rx="17"/></clipPath>
    <image href="generator-412x915.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#generatorClip)"/>
    <text x="16" y="791" fill="#e1e6e2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Generated locally</text>
    <text x="344" y="791" fill="#727a74" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">412 × 915</text>
  </g>
  <g transform="translate(440 140)">
    <rect width="360" height="800" rx="24" fill="#151918" stroke="#2b332d"/>
    <clipPath id="planClip"><rect x="8" y="8" width="344" height="764" rx="17"/></clipPath>
    <image href="generated-plan-412x915.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#planClip)"/>
    <text x="16" y="791" fill="#e1e6e2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Canonical plan rows</text>
    <text x="344" y="791" fill="#727a74" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">412 × 915</text>
  </g>
  <g transform="translate(840 140)">
    <rect width="360" height="800" rx="24" fill="#151918" stroke="#2b332d"/>
    <clipPath id="durationClip"><rect x="8" y="8" width="344" height="764" rx="17"/></clipPath>
    <image href="duration-15-360x800.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#durationClip)"/>
    <text x="16" y="791" fill="#e1e6e2" font-family="system-ui,sans-serif" font-size="11" font-weight="700">15-minute generation</text>
    <text x="344" y="791" fill="#727a74" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">360 × 800</text>
  </g>
</svg>
